<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاركة الملفات والنصوص 2</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .live-badge {
            text-align: center;
            color: #a5ffb0;
            font-size: 14px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            100% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .tab-btn.active:hover {
            background: white;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
            direction: rtl;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .name-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 12px;
            direction: rtl;
        }

        .name-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-upload {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload:hover {
            background: #f5f5ff;
        }

        .file-upload.dragover {
            background: #e8e8ff;
            border-color: #764ba2;
        }

        .file-upload-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .file-upload-text {
            color: #666;
            font-size: 18px;
        }

        .file-upload-hint {
            color: #999;
            font-size: 14px;
            margin-top: 10px;
        }

        #fileInput {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 15px;
            color: #667eea;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-icon {
            font-size: 24px;
        }

        .file-name {
            font-weight: bold;
            color: #333;
        }

        .file-size {
            color: #666;
            font-size: 14px;
        }

        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        /* ============ LIVE FEED ============ */
        .feed-section {
            margin-top: 30px;
        }

        .feed-title {
            color: white;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feed-count {
            background: rgba(255,255,255,0.2);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .feed-items {
            max-height: 70vh;
            overflow-y: auto;
            padding: 5px;
        }

        .feed-empty {
            color: rgba(255,255,255,0.7);
            text-align: center;
            padding: 30px;
            font-size: 16px;
        }

        .feed-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .feed-username {
            font-weight: bold;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feed-user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .feed-time {
            color: #999;
            font-size: 12px;
        }

        .feed-text {
            background: #f5f5ff;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            direction: rtl;
            font-size: 15px;
            line-height: 1.7;
        }

        .feed-files-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .feed-file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .feed-file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .feed-file-name {
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }

        .feed-file-size {
            color: #666;
            font-size: 13px;
        }

        .feed-download {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .feed-download:hover {
            background: #229954;
        }

        .feed-type-badge {
            font-size: 11px;
            background: rgba(102,126,234,0.15);
            color: #667eea;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

        .feed-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .feed-action-btn {
            background: none;
            border: 1px solid #ddd;
            color: #666;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .feed-action-btn:hover {
            background: #f0f0f0;
        }

        .feed-action-btn.danger:hover {
            background: #ffebee;
            color: #c62828;
            border-color: #ffcdd2;
        }

        .delete-password-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            direction: rtl;
        }

        .connection-banner {
            background: #ff9800;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .scroll-top {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: 0 3px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            font-size: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 مشاركة الملفات والنصوص 2</h1>
        <div class="live-badge"><span class="live-dot"></span> مباشر — كل ما يُنشر يظهر فوراً للجميع</div>

        <div id="offlineBanner" class="connection-banner">⚠️ تعذر الاتصال — يرجى التحقق من الإنترنت</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('text')">📝 كتابة نص</button>
            <button class="tab-btn" onclick="switchTab('file')">📁 رفع ملف</button>
        </div>

        <div class="card">
            <!-- Text Tab -->
            <div id="textTab" class="tab-content active">
                <input type="text" class="name-input" id="textName" placeholder="اسمك (اختياري)">

                <textarea id="textInput" placeholder="اكتب نصك هنا... سيظهر للجميع فوراً"></textarea>
                <button class="btn btn-primary" onclick="publishText()" id="pubTextBtn">📤 نشر النص</button>
            </div>

            <!-- File Tab -->
            <div id="fileTab" class="tab-content">
                <input type="text" class="name-input" id="fileName" placeholder="اسمك (اختياري)">

                <div class="file-upload" onclick="document.getElementById('fileInput').click()">
                    <div class="file-upload-icon">📤</div>
                    <div class="file-upload-text">اختر الملفات للرفع</div>
                    <div class="file-upload-hint">الحد الأقصى 4 ميجابايت لكل ملف — سيظهر للجميع فوراً</div>
                </div>
                <input type="file" id="fileInput" multiple onchange="handleFiles(this.files)">
                
                <div id="fileList" class="file-list"></div>
                
                <button class="btn btn-primary" onclick="publishFiles()" id="pubFileBtn" style="display:none;">📤 نشر الملفات</button>
                
                <div id="fileLoading" class="loading">
                    <div class="spinner"></div>
                    جاري رفع الملفات...
                </div>
            </div>
        </div>

        <div class="feed-section">
            <div class="feed-title">📜 المحتوى المشترك الآن <span class="feed-count" id="feedCount">0</span></div>
            <div id="feed" class="feed-items">
                <div class="feed-empty" id="feedEmpty">لا يوجد محتوى بعد — كن أول من يشارك 📢</div>
            </div>
        </div>
    </div>

    <button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆️</button>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyCKwzzXvsP8P2FDzjYoUPrjpuIS2x0Xrd0",
            authDomain: "share-e8654.firebaseapp.com",
            databaseURL: "https://share-e8654-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "share-e8654",
            storageBucket: "share-e8654.firebasestorage.app",
            messagingSenderId: "531265630104",
            appId: "1:531265630104:web:509d4444c59651f21685ed"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const feedRef = database.ref('feed');
        // =========================================================

        const MAX_TEXT_LENGTH = 100000;
        const MAX_FILE_SIZE = 4 * 1024 * 1024;
        const KEEP_DAYS = 7;

        let selectedFiles = [];
        let connected = true;

        // ============ CONNECTION STATUS ============
        const connectedRef = database.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            connected = snap.val();
            if (!connected) {
                document.getElementById('offlineBanner').style.display = 'block';
            } else {
                document.getElementById('offlineBanner').style.display = 'none';
            }
        });

        // ============ LIVE FEED LISTENER ============
        feedRef.orderByChild('timestamp').limitToLast(50).on('value', (snapshot) => {
            renderFeed(snapshot);
        });

        handleRootListener();

        function handleRootListener() {
            database.ref('.info/serverTimeOffset').once('value').catch(() => {});
        }

        function renderFeed(snapshot) {
            const feed = document.getElementById('feed');
            const count = document.getElementById('feedCount');
            
            if (!snapshot.exists()) {
                feed.innerHTML = '<div class="feed-empty" id="feedEmpty">لا يوجد محتوى بعد — كن أول من يشارك 📢</div>';
                count.textContent = '0';
                return;
            }
            
            // Build items array sorted by timestamp (newest last, newest first in display)
            const items = [];
            snapshot.forEach((child) => {
                items.push({ key: child.key, ...child.val() });
            });
            
            // Remove expired items from display and optionally from database
            const now = Date.now();
            const validItems = items.filter(item => !item.expires || item.expires > now);
            
            // Sort newest first
            validItems.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            
            count.textContent = validItems.length;
            
            if (validItems.length === 0) {
                feed.innerHTML = '<div class="feed-empty" id="feedEmpty">لا يوجد محتوى بعد — كن أول من يشارك 📢</div>';
                return;
            }
            
            feed.innerHTML = validItems.map(item => buildFeedCard(item)).join('');
        }

        function buildFeedCard(item) {
            const user = escapeHtml(item.name || 'زائر');
            const avatar = user.charAt(0);
            const time = formatTime(item.timestamp);
            
            let body = '';
            
            if (item.type === 'text' && item.text) {
                body = `<div class="feed-text">${escapeHtml(item.text)}</div>`;
            } else if (item.type === 'files' && item.files && item.files.length) {
                body = `<div class="feed-files-title">📁 ${item.files.length} ملف</div>`;
                item.files.forEach((file, i) => {
                    body += `
                        <div class="feed-file-item">
                            <div class="feed-file-info">
                                <span class="file-icon">${getFileIcon(file.type)}</span>
                                <div style="min-width:0;">
                                    <div class="feed-file-name">${escapeHtml(file.name)}</div>
                                    <div class="feed-file-size">${formatSize(file.size)}</div>
                                </div>
                            </div>
                            <button class="feed-download" onclick="downloadFileFromData('${item.key}', ${i})">⬇️ تحميل</button>
                        </div>
                    `;
                });
            }
            
            const typeBadge = item.type === 'text' ? 'نص' : 'ملفات';
            
            return `
                <div class="feed-card" data-key="${item.key}">
                    <div class="feed-header">
                        <div class="feed-username">
                            <span class="feed-user-avatar">${avatar}</span>
                            ${user}
                            <span class="feed-type-badge">${typeBadge}</span>
                        </div>
                        <span class="feed-time">${time}</span>
                    </div>
                    ${body}
                    <div class="feed-actions">
                        <button class="feed-action-btn" onclick="toggleDelete('${item.key}')">🗑️ حذف</button>
                    </div>
                    <div id="deleteBox_${item.key}" style="display:none;">
                        <input type="password" class="delete-password-input" id="delPass_${item.key}" placeholder="كلمة المرور للمشرف (اختياري — اتركه فارغاً للحذف الفوري)">
                        <button class="btn btn-primary" style="margin-top:10px; background:#e74c3c;" onclick="deleteItem('${item.key}')">تأكيد الحذف</button>
                    </div>
                </div>
            `;
        }

        function toggleDelete(key) {
            const box = document.getElementById('deleteBox_' + key);
            if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        function deleteItem(key) {
            const pass = document.getElementById('delPass_' + key)?.value || '';
            if (pass && pass !== ADMIN_PASSWORD) {
                alert('كلمة المرور غير صحيحة');
                return;
            }
            
            if (pass !== ADMIN_PASSWORD && !pass) {
                // Allow anyone to delete their own posts - for now allow delete (test mode)
            }
            
            feedRef.child(key).remove().then(() => {
                alert('تم الحذف');
            }).catch((err) => {
                alert('فشل الحذف: ' + err.message);
            });
        }

        function downloadFileFromData(key, index) {
            feedRef.child(key).once('value').then((snap) => {
                const data = snap.val();
                if (!data || !data.files || !data.files[index]) return;
                const file = data.files[index];
                const a = document.createElement('a');
                a.href = file.dataUrl;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        }

        // If you want a real admin password, change this and add a delete flow
        const ADMIN_PASSWORD = '';

        // ============ PUBLISH TEXT ============
        function publishText() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert('اكتب نصاً أولاً');
                return;
            }
            if (text.length > MAX_TEXT_LENGTH) {
                alert('النص طويل جداً');
                return;
            }
            
            const btn = document.getElementById('pubTextBtn');
            btn.disabled = true;
            
            const name = getSafeName(document.getElementById('textName').value);
            
            feedRef.push({
                type: 'text',
                text: text,
                name: name,
                timestamp: Date.now(),
                expires: Date.now() + (KEEP_DAYS * 24 * 60 * 60 * 1000)
            }).then(() => {
                document.getElementById('textInput').value = '';
                btn.disabled = false;
            }).catch((err) => {
                btn.disabled = false;
                alert('فشل النشر: ' + err.message);
            });
        }

        // ============ PUBLISH FILES ============
        async function publishFiles() {
            if (selectedFiles.length === 0) return;
            
            const btn = document.getElementById('pubFileBtn');
            const loading = document.getElementById('fileLoading');
            btn.disabled = true;
            loading.classList.add('show');
            
            try {
                const fileRecords = [];
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const dataUrl = await readFileAsBase64(file);
                    fileRecords.push({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        dataUrl: dataUrl
                    });
                }
                
                const name = getSafeName(document.getElementById('fileName').value);
                
                await feedRef.push({
                    type: 'files',
                    files: fileRecords,
                    name: name,
                    timestamp: Date.now(),
                    expires: Date.now() + (KEEP_DAYS * 24 * 60 * 60 * 1000)
                });
                
                selectedFiles = [];
                displayFiles();
            } catch (err) {
                alert('فشل رفع الملفات: ' + err.message);
            } finally {
                btn.disabled = false;
                loading.classList.remove('show');
            }
        }

        // ============ HELPERS ============
        function getSafeName(value) {
            const v = (value || '').trim();
            if (!v) return 'زائر';
            return v.substring(0, 40);
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function handleFiles(files) {
            for (let file of files) {
                if (file.size > MAX_FILE_SIZE) {
                    alert('الملف "' + file.name + '" أكبر من 4 ميجابايت، لن يتم إرفاقه.');
                    continue;
                }
                if (!selectedFiles.find(f => f.name === file.name && f.size === file.size)) {
                    selectedFiles.push(file);
                }
            }
            displayFiles();
        }

        function displayFiles() {
            const fileList = document.getElementById('fileList');
            const shareBtn = document.getElementById('pubFileBtn');
            
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                shareBtn.style.display = 'none';
                return;
            }
            
            shareBtn.style.display = 'block';
            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-info">
                        <span class="file-icon">${getFileIcon(file.type)}</span>
                        <span class="file-name">${escapeHtml(file.name)}</span>
                        <span class="file-size">(${formatSize(file.size)})</span>
                    </div>
                    <button class="remove-btn" onclick="removeFile(${index})">×</button>
                </div>
            `).join('');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFiles();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'text') {
                document.querySelector('.tab-btn:first-child').classList.add('active');
                document.getElementById('textTab').classList.add('active');
            } else {
                document.querySelector('.tab-btn:last-child').classList.add('active');
                document.getElementById('fileTab').classList.add('active');
            }
        }

        // Drag and drop
        const fileUpload = document.querySelector('.file-upload');
        
        fileUpload.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUpload.classList.add('dragover');
        });
        
        fileUpload.addEventListener('dragleave', () => {
            fileUpload.classList.remove('dragover');
        });
        
        fileUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUpload.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        function getFileIcon(type) {
            if (type.startsWith('image/')) return '🖼️';
            if (type.startsWith('video/')) return '🎬';
            if (type.startsWith('audio/')) return '🎵';
            if (type.includes('pdf')) return '📄';
            if (type.includes('zip') || type.includes('rar')) return '📦';
            return '📁';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' بايت';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' كيلوبايت';
            return (bytes / (1024 * 1024)).toFixed(1) + ' ميجابايت';
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        // Cleanup old items (older than KEEP_DAYS)
        function cleanupOld() {
            const cutoff = Date.now() - (KEEP_DAYS * 24 * 60 * 60 * 1000);
            feedRef.orderByChild('timestamp').endAt(cutoff).limitToLast(200).once('value').then((snap) => {
                const updates = {};
                snap.forEach((child) => {
                    updates[child.key] = null;
                });
                if (Object.keys(updates).length) {
                    feedRef.update(updates);
                }
            }).catch(() => {});
        }
        cleanupOld();
    </script>
</body>
</html>
